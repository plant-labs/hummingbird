[project]
name = "hummingbird-api"
version = "0.1.0"
description = "Hummingbird FastAPI serving layer"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "psycopg[binary]>=3.1",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "hummingbird-schemas",
]

[tool.uv.sources]
hummingbird-schemas = { path = "../../packages/schemas", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
